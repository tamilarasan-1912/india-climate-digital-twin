name: Digital Twin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall backend scripts
      - run: python - <<'PY'
import importlib
mods = [
    'backend.api.main',
    'backend.services.digital_twin_service',
    'backend.services.climate_risk_service',
    'backend.services.extreme_event_service',
]
for mod in mods:
    importlib.import_module(mod)
    print('IMPORT PASS', mod)
PY
