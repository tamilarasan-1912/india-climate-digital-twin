name: Digital Twin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Validates both Dockerfiles build and that the API image actually serves
      # the health endpoint, without depending on any external climate provider.
      - run: docker build -t ict-api:ci -f backend/Dockerfile .
      - run: docker build -t ict-web:ci --build-arg NEXT_PUBLIC_API_URL=http://api:8000 .
      - name: API image serves /api/health
        run: |
          docker run -d --name ict-api-ci -p 8000:8000 ict-api:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health
          docker rm -f ict-api-ci

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall backend scripts
      - run: |
          python - <<'PY'
          import importlib
          mods = [
              'backend.api.main',
              'backend.api.platform_routes',
              'backend.services.digital_twin_service',
              'backend.services.twin_engine',
              'backend.services.climate_risk_service',
              'backend.services.extreme_event_service',
              'backend.services.risk_engine',
              'backend.services.scenario_engine',
              'backend.services.dataset_catalog',
              'backend.services.alert_service',
              'backend.services.flood_twin_service',
              'backend.services.climate_layer_service',
              'backend.api.ogc_routes',
          ]
          for mod in mods:
              importlib.import_module(mod)
              print('IMPORT PASS', mod)
          PY
      - run: python -m unittest discover -s backend/tests -p 'test_*.py' -v
      # A number of test modules use pytest-style fixtures. `unittest discover`
      # silently skips them, so both runners are required to get real coverage.
      - run: python -m pytest backend/tests -q
